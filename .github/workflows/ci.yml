name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build the interactive desktop application
        run: cargo build --locked -p kova-desktop

      - name: Exercise real Windows interactions and capture product views
        timeout-minutes: 4
        shell: pwsh
        run: |
          ./scripts/test-ui.ps1 -Executable target/debug/kova-desktop.exe
          ./scripts/capture-demo.ps1 -Executable target/debug/kova-desktop.exe

      - name: Preserve Windows interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-evidence
          path: |
            target/runtime/ui-test-*/**
            target/runtime/demo-*/screenshots/*
            target/runtime/demo-*/app.log
            target/runtime/demo-*/error.log
          if-no-files-found: ignore
          retention-days: 7

  # Both the repository ruleset (windows) and branch protection (CI) are required.
  # Keep CI as an aggregate of the actual Windows quality gates, including failures.
  ci:
    name: CI
    needs: windows
    if: ${{ always() }}
    runs-on: windows-latest
    steps:
      - name: Require successful Windows quality gates
        shell: pwsh
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if ($env:WINDOWS_RESULT -ne 'success') {
            throw "Windows quality gates did not pass: $env:WINDOWS_RESULT"
          }
