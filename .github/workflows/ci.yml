name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Both the repository ruleset (windows) and branch protection (CI) are required.
  # Keep CI as an aggregate of the actual Windows quality gates, including failures.
  ci:
    name: CI
    needs: windows
    if: ${{ always() }}
    runs-on: windows-latest
    steps:
      - name: Require successful Windows quality gates
        shell: pwsh
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if ($env:WINDOWS_RESULT -ne 'success') {
            throw "Windows quality gates did not pass: $env:WINDOWS_RESULT"
          }
