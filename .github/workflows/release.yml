name: Windows packages

on:
  push:
    branches: [release/windows-installer]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_package_run:
        description: 'Optional: verify UI of an existing successful Windows packages run'
        required: false
        type: string
      capture_demo:
        description: 'Capture product views after the interactive tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: inputs.verify_package_run == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install license inventory tool
        shell: pwsh
        run: |
          $name = 'cargo-about-0.9.2-x86_64-pc-windows-msvc'
          $base = 'https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2'
          Invoke-WebRequest "$base/$name.tar.gz" -OutFile "$env:RUNNER_TEMP/about.tar.gz"
          $expected = (Invoke-RestMethod "$base/$name.tar.gz.sha256").Trim().Split(' ')[0]
          if ((Get-FileHash "$env:RUNNER_TEMP/about.tar.gz").Hash -ne $expected) { throw 'Checksum mismatch' }
          tar -xf "$env:RUNNER_TEMP/about.tar.gz" -C $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/$name" | Out-File $env:GITHUB_PATH -Append
      - name: Build setup and portable ZIP
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Test installation, launch and removal
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kova-windows-x64
          path: dist/*
          if-no-files-found: error

  interactive-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_package_run != ''
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: kova-windows-x64
          run-id: ${{ inputs.verify_package_run }}
          github-token: ${{ github.token }}
          path: target/ui-download
      - name: Verify package provenance and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.verify_package_run }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN" | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/release.yml') { throw 'Expected a successful Windows packages run' }
          "Package source: $($run.head_sha)" | Set-Content target/ui-download/provenance.txt
          foreach ($line in Get-Content target/ui-download/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-fA-F0-9]{64})  (Kova[-A-Za-z0-9.]+)$') { throw 'Invalid package checksum entry' }
            if ((Get-FileHash -LiteralPath (Join-Path target/ui-download $Matches[2])).Hash -ne $Matches[1]) { throw 'Package checksum mismatch' }
          }
          $zips = @(Get-ChildItem target/ui-download/Kova-*-x64.zip)
          if ($zips.Count -ne 1) { throw 'Expected one portable package' }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath target/ui-package
      - name: Exercise keyboard, accessibility and native drag/drop
        shell: powershell
        run: ./scripts/test-ui.ps1 -Executable target/ui-package/Kova.exe
      - name: Measure real large-folder UI behavior
        shell: powershell
        run: ./scripts/benchmark-ui.ps1 -Executable target/ui-package/Kova.exe -PrepareFixtures
      - name: Capture real product windows and conflict flow
        if: inputs.capture_demo
        shell: powershell
        run: ./scripts/capture-demo.ps1 -Executable target/ui-package/Kova.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kova-ui-verification
          path: |
            target/runtime/ui-test-*/
            target/runtime/ui-benchmark/
            target/runtime/demo-*/
            target/ui-download/provenance.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: kova-windows-x64
          path: dist
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "Kova $RELEASE_TAG — Windows preview" --notes-file packaging/release-notes.md
